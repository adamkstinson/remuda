name: poll-and-execute
output: summary
# Three triggers, computed deterministically each run over the open work items
# assigned to this agent: Respond (a fresh comment not authored by me), then
# Continue (my In Progress items), then Start (my To Do items that no open item
# in this project is blocking — see the gate above that trigger for what that
# check does and does not cover). Resume-before-start. Anything matching no trigger is
# not touched. An idle run spawns zero agents.
steps:
  # A run that cannot reach the system of record must not start.
  - id: require-plane
    tool: plane_get_me
    args: {}
    store_as: plane_identity

  # 47bbd93b-ee51-4c05-b4cb-d9fcfecdba06 and ae4cc8f9-3a8c-43da-91b1-94cb80ab6205 are replaced with literal
  # UUIDs at provisioning. Every filter below is client-side: the API silently
  # ignores assignees/state query params (verified 2026-08-19 — the CE list
  # endpoint reads no filter params at all).
  - id: fetch-work-items
    tool: plane_list_work_items
    args:
      project_id: "47bbd93b-ee51-4c05-b4cb-d9fcfecdba06"
      per_page: 100
      expand: state
    store_as: work_items_response

  - id: not-completed
    tool: filter
    filter: work_items_response.results
    where: item.state.group != "completed"
    store_as: not_completed
  - id: open-items
    tool: filter
    filter: not_completed
    where: item.state.group != "cancelled"
    store_as: open_items

  # `contains` stringifies the assignees array, so a UUID match works.
  - id: my-items
    tool: filter
    filter: open_items
    where: item.assignees contains "ae4cc8f9-3a8c-43da-91b1-94cb80ab6205"
    store_as: my_items

  # ── Trigger 1: Respond ────────────────────────────────────────────────────
  # Fresh comments not authored by me, on any of my open items. The 25h window
  # tolerates missed runs; the agent no-ops anything already answered.

  # continue_on_error is explicit here: one unreadable comment page must not
  # cost the whole run. A for_each that hard-fails now stops the run (so the
  # sequencing gate below can never pass on partial data), which makes the
  # tolerant steps the ones that have to say so.
  - id: fetch-comments
    for_each: length(my_items)
    as_var: wi
    continue_on_error: true
    tool: plane_list_work_item_comments
    args:
      project_id: "47bbd93b-ee51-4c05-b4cb-d9fcfecdba06"
      work_item_id: "{{ wi.id }}"
      per_page: 100
    store_as: comment_pages

  - id: all-comments
    tool: flatten
    args:
      source: comment_pages
      path: results
    store_as: all_comments

  - id: foreign-comments
    tool: filter
    filter: all_comments
    where: item.created_by != "ae4cc8f9-3a8c-43da-91b1-94cb80ab6205"
    store_as: foreign_comments

  - id: fresh-comments
    tool: filter
    filter: foreign_comments
    where: item.created_at after 25h ago
    store_as: fresh_comments

  - id: respond
    for_each: length(fresh_comments)
    as_var: comment
    tool: agent
    continue_on_error: true
    args:
      prompt: |
        You are the Remuda Project Agent. The Respond trigger fired:
        a comment on one of your work items, not authored by you, from the
        last day:
        {{ comment }}

        Load the `respond-to-comments` skill. The comment's `issue` field is
        the work item id; your project id is 47bbd93b-ee51-4c05-b4cb-d9fcfecdba06. Read ALL
        comments on that item before replying — if you already answered this
        one on a previous run, reply no-op and write nothing.

        You write comments only via `plane_create_comment` — no state,
        assignee, date, title, or description changes from this trigger.

        Plane is the system of record — if `plane_*` tools are unavailable,
        stop and say so.

        Reply with: work_item_id and a one-line summary of what you wrote,
        or no-op.
    store_as: respond_reports
    model: opencode/deepseek-v4-pro

  # ── Trigger 2: Continue ───────────────────────────────────────────────────
  # Ready For Review is also in the started group — exclude it by name; items
  # there are in Ops's court and match no trigger.

  - id: started-mine
    tool: filter
    filter: my_items
    where: item.state.group == "started"
    store_as: started_mine
  - id: in-progress
    tool: filter
    filter: started_mine
    where: item.state.name != "Ready For Review"
    store_as: in_progress

  - id: continue-work
    for_each: length(in_progress)
    as_var: wi
    tool: agent
    continue_on_error: true
    args:
      prompt: |
        You are the Remuda Project Agent. The Continue trigger
        fired: one of your work items in In Progress:
        {{ wi }}

        Load the `execute-work` skill and continue it: fresh full read first
        (comments included — answer anything unanswered before working), then
        execute toward a natural stopping point. End the session in exactly
        one of three ways per the skill: a session progress comment; done —
        completion report then the In Progress → Ready For Review transition;
        or blocked — an escalation comment, no state change.

        Plane is the system of record — if `plane_*` tools are unavailable,
        stop and say so.

        Reply with: work_item_id, the outcome (progress / done / blocked),
        and a one-line summary.
    store_as: continue_reports
    model: opencode/deepseek-v4-pro

  # ── Trigger 3: Start ──────────────────────────────────────────────────────
  # Any To Do item of mine. No date gate: agents have no capacity constraint,
  # so sequencing (blocked_by) is the only thing that orders the work.

  # Agents have no calendar and no capacity limit, so there is no date window
  # (Adam, 2026-08-22) — sequencing is the only thing that orders the work. The
  # old start_date/target_date filters here were what kept agent items
  # permanently unstartable: scheduling capped agents at zero capacity for
  # having no calendar, so it never wrote them a start_date.
  #
  # Removing those left NO gate at all: `state.group == "unstarted"` was the
  # whole test, and the prompt then asserted "with no open blockers" as a fact
  # nothing had checked. The Echo Agent was woken five times in one day on
  # ECDOF-13, whose four blockers were all open, and correctly refused every
  # time (OPS-130). The gate below is that check, computed here, before any
  # agent is spawned.
  #
  # It reads the edges from the BLOCKER's side: every open item in this project
  # names what it blocks, so the union of those `blocking` lists is the set of
  # ids that something unfinished still gates. An item of mine outside that set
  # is startable. The forward direction — resolve each of MY blocked_by edges
  # and check its state — is the one we want, but a per-item fetch cannot be
  # joined back to its item inside a `where`, so this reads it backwards.
  #
  # KNOWN HOLE: a blocker living in a project this agent cannot read is never
  # enumerated here, so an item whose ONLY open blocker is cross-project still
  # looks startable. Closing that needs the forward direction. Tracked on
  # OPS-130; do not treat this gate as fail-closed against cross-project edges.
  #
  # No continue_on_error on the fetch: a relations call that hard-fails stops
  # the run rather than gating on half the graph.
  - id: fetch-relations
    for_each: length(open_items)
    as_var: wi
    tool: plane_list_work_item_relations
    args:
      project_id: "47bbd93b-ee51-4c05-b4cb-d9fcfecdba06"
      work_item_id: "{{ wi.id }}"
    store_as: relation_pages

  - id: blocked-edges
    tool: flatten
    args:
      source: relation_pages
      path: blocking
    store_as: blocked_edges

  - id: unstarted-mine
    tool: filter
    filter: my_items
    where: item.state.group == "unstarted"
    store_as: unstarted_mine

  # `not contains` is a substring test over the stringified edge list, so an
  # item id appearing anywhere in it means something open still blocks it.
  - id: startable
    tool: filter
    filter: unstarted_mine
    where: blocked_edges not contains item.id
    store_as: startable

  - id: start-work
    for_each: length(startable)
    as_var: wi
    tool: agent
    continue_on_error: true
    args:
      prompt: |
        You are the Remuda Project Agent. The Start trigger fired
        on one of your To Do work items:
        {{ wi }}

        WHAT WAS ALREADY CHECKED: no open work item in this project names this
        one in its `blocking` list. That is a real check, run before you were
        woken — not a claim to take on trust, and not the whole gate.

        WHAT IT DOES NOT COVER: a blocker in a project this agent cannot read.
        Re-verify from a fresh read — `plane_list_work_item_relations` on this
        item, every blocked_by edge resolved, each one completed or cancelled.
        A blocker you cannot retrieve counts as OPEN. An open blocker means do
        NOT start — that is the blocked outcome (escalation comment), never a
        workaround. If you refuse, say which edge and why, once. Gate holds:
        plan first if no plan comment exists (`plan-work-item`), starting
        comment, move To Do → In Progress, then execute toward a stopping
        point and end the session per the skill.

        Plane is the system of record — if `plane_*` tools are unavailable,
        stop and say so.

        Reply with: work_item_id, whether it started, the session outcome,
        and a one-line summary.
    store_as: start_reports
    model: opencode/deepseek-v4-pro

  - id: summarize
    tool: agent
    args:
      prompt: |
        Summarize this poll-and-execute run for the Remuda project
        agent from the trigger reports below. Include counts per trigger
        INCLUDING zeros, every work item touched with its outcome, and
        anything flagged for Ops or Adam. Report only — write nothing.

        Respond: {{ respond_reports }}
        Continue: {{ continue_reports }}
        Start: {{ start_reports }}
    store_as: summary
    model: opencode/deepseek-v4-flash
